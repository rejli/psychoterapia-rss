name: Aktualizacja kanału RSS

on:
  schedule:
    - cron: "23 4 * * *"   # codziennie o 4:23 UTC (5:23 zimą, 6:23 latem czasu polskiego)
  workflow_dispatch:        # pozwala uruchomić ręcznie przyciskiem "Run workflow"

permissions:
  contents: write

concurrency:
  group: rss
  cancel-in-progress: false

jobs:
  aktualizacja:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Uruchom bota
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python bot.py

      - name: Zapisz zmiany w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml state.json
          git diff --cached --quiet || git commit -m "Aktualizacja kanału RSS"
          git push
